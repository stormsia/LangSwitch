name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build MSI Installer
        run: cargo wix --no-build --nocapture --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: |
          Copy-Item target\x86_64-pc-windows-msvc\release\langswitch.exe langswitch.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LangSwitch ${{ github.ref_name }}
          body: |
            ## LangSwitch ${{ github.ref_name }}

            KDE Plasma–style keyboard layout switcher OSD for Windows.

            ### Installation
            **Option 0: WinGet (Recommended)**
            ```cmd
            winget install stormsia.LangSwitch
            ```

            **Option 1: Installer (Recommended)**
            Download and run `langswitch-*.msi`. It will install LangSwitch to `C:\Program Files\LangSwitch`, add a Start Menu shortcut, and automatically configure it to run on Windows startup.

            **Option 2: Portable**
            Download `langswitch.exe` and place it anywhere.
            > **Autostart:** To run on startup, place a shortcut in `shell:startup`.

            ---
            **Usage:** Switch layout with `Ctrl+Alt` or standard Windows shortcuts to see the OSD. Right-click the tray icon to exit.
          files: |
            langswitch.exe
            target/wix/langswitch-*.msi
          draft: false
          prerelease: false

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: stormsia.LangSwitch
          max-retries: 3
          token: ${{ secrets.WINGET_TOKEN }}