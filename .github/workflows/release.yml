name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: |
          Copy-Item target\x86_64-pc-windows-msvc\release\langswitch.exe langswitch.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LangSwitch ${{ github.ref_name }}
          body: |
            ## LangSwitch ${{ github.ref_name }}

            KDE Plasma–style keyboard layout switcher OSD for Windows.

            ### Installation
            1. Download `langswitch.exe` below
            2. Run it — tray icon will appear
            3. Switch layout with `Alt+Shift` or `Win+Space` to see the OSD

            > **Autostart:** Place shortcut in `shell:startup`
          files: langswitch.exe
          draft: false
          prerelease: false
